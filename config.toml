[plugin]
enabled = true
config_version = "3.1.0"
auto_install_deps = false
game_version = 25500
developer_qq = []

[server]
base_url = "https://www.diving-fish.com/api/maimaidxprober"
request_timeout = 30
music_cache_ttl = 300
developer_token = ""

[lxns]
enable = true
base_url = "https://maimai.lxns.net/api/v0"
asset_url = "https://assets.lxns.net"
request_timeout = 30
music_cache_ttl = 300
enable_oauth = false
oauth_client_id = ""
oauth_client_secret = ""
oauth_authorize_url = "https://maimai.lxns.net/oauth/authorize"
oauth_redirect_uri = ""
oauth_scope = "read_player write_player read_user_profile"
enable_developer_api = false
developer_api_key = ""

[render]
device_scale_factor = 2.0
image_timeout_ms = 15000
browser_executable = ""
headless = true
no_sandbox = true
